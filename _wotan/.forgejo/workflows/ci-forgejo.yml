name: NixOS Configuration Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    container: 
      image: nixos/nix:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Nix
        run: |
          mkdir -p ~/.config/nix
          cat > ~/.config/nix/nix.conf << 'EOF'
          experimental-features = nix-command flakes
          accept-flake-config = true
          EOF

      - name: Check Nix formatting
        run: nix run nixpkgs#alejandra -- --check .

      - name: Check flake
        run: nix flake check --no-build

      - name: Build NixOS configuration
        run: nix build .#nixosConfigurations.wotan.config.system.build.toplevel --no-link

      - name: Build home-manager configuration
        run: nix build .#homeConfigurations.amadeus@wotan.activationPackage --no-link
