name: NixOS Configuration Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 ${{ env.GITEA_REPOSITORY_URL }} .

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install linux --no-confirm
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

      - name: Check Nix formatting
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix run nixpkgs#alejandra -- --check .

      - name: Check flake
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix flake check --accept-flake-config

      - name: Build NixOS configuration
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix build .#nixosConfigurations.wotan.config.system.build.toplevel --no-link

      - name: Build home-manager configuration
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix build .#homeConfigurations.amadeus@wotan.activationPackage --no-link
