name: NixOS Configuration Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v9

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Nix
        run: |
          mkdir -p ~/.config/nix
          echo "accept-flake-config = true" >> ~/.config/nix/nix.conf

      - name: Check Nix formatting
        run: nix run nixpkgs#alejandra -- --check .

      - name: Check flake
        run: nix flake check --no-build

      - name: Build NixOS configuration
        run: nix build .#nixosConfigurations.wotan.config.system.build.toplevel --no-link

      - name: Build home-manager configuration
        run: nix build .#homeConfigurations.amadeus@wotan.activationPackage --no-link
