pre-commit:
  parallel: true
  jobs:
    - run: alejandra {staged_files}
      glob: "*.{nix}"
      stage_fixed: true
    - name: keep-sorted
      run: keep-sorted {staged_files}
      stage_fixed: true
    - name: just
      run: just --fmt
      stage_fixed: true
commit-msg:
  jobs:
    - name: cog verify
      run: cog verify --file {1}
pre-push:
  parallel: true
  jobs:
    - name: cog check
      run: cog check --from-latest-tag
    - name: build NixOS system
      run: nh os build .#nixosConfigurations.wotan
    - name: build home-manager activation
      run: nix build .#nixosConfigurations.wotan.config.home-manager.users.amadeus.home.activationPackage --dry-run
    - name: nix flake check
      run: nix flake check
