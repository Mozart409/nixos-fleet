pre-commit:
  parallel: true
  jobs:
    - run: alejandra {staged_files}
      glob: "*.{nix}"
      stage_fixed: true
    - name: keep-sorted
      run: keep-sorted {staged_files}
      stage_fixed: true
    - name: just
      run: just --fmt
      stage_fixed: true
    # No stage_fixed: shellcheck only reports, it does not rewrite files.
    - name: shellcheck
      run: shellcheck {staged_files}
      glob: "*.sh"
commit-msg:
  jobs:
    - name: cog verify
      run: cog verify --file {1}
pre-push:
  parallel: true
  jobs:
    - name: cog check
      run: cog check --from-latest-tag
    - name: nix flake check
      run: nix flake check
